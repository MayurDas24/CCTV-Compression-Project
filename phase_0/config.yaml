baseline:
  codec: "libx265"
  preset: "medium"
  crf: 28
  pixel_format: "yuv420p"
  video_only: true

adaptive:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.35
  target_classes:
    - 0  # person
    - 2  # car
    - 3  # motorcycle
    - 5  # bus
    - 7  # truck
  quality_policy:
    roi_crf: 20
    background_crf: 35
    background_blur_kernel: 15

evaluation:
  metrics:
    - psnr
    - ssim
  device: "cpu"